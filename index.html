<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 ITDD & IT Integration Flashcards</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 640px; margin: 0 auto; }

  /* Header */
  .header {
    text-align: center;
    padding: 20px 0 10px;
  }
  .header h1 { font-size: 1.6rem; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header p { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }

  /* Stats bar */
  .stats-bar {
    display: flex;
    justify-content: space-around;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 12px;
    margin: 12px 0 16px;
    font-size: 0.8rem;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .stats-bar .stat { text-align: center; }
  .stats-bar .num { font-size: 1.3rem; font-weight: 700; color: #38bdf8; display: block; }
  .stats-bar .num.green { color: #4ade80; }
  .stats-bar .num.red { color: #fb7185; }
  .stats-bar .num.yellow { color: #fbbf24; }
  .stats-bar .label { color: #64748b; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; }

  /* Progress bar */
  .progress-wrap { background: rgba(255,255,255,0.06); border-radius: 8px; height: 8px; margin: 4px 0 16px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #38bdf8, #818cf8); border-radius: 8px; transition: width 0.4s ease; width: 0%; }

  /* Controls */
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .controls button {
    flex: 1;
    min-width: 70px;
    padding: 10px 8px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    color: #cbd5e1;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .controls button:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
  .controls button.active { background: rgba(56,189,248,0.15); border-color: #38bdf8; color: #38bdf8; }

  /* Category filter */


  /* Speak button */
  .speak-btn {
    background: rgba(255,255,255,0.08);
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .speak-btn:hover { background: rgba(255,255,255,0.18); transform: scale(1.1); }
  .speak-btn:active { transform: scale(0.9); }

  /* Card */
  .card-container {
    perspective: 1200px;
    margin-bottom: 16px;
  }
  .card {
    position: relative;
    width: 100%;
    min-height: 280px;
    cursor: pointer;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    transform-style: preserve-3d;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute;
    width: 100%;
    min-height: 280px;
    backface-visibility: hidden;
    border-radius: 16px;
    padding: 30px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .card-front {
    background: linear-gradient(145deg, rgba(30,41,59,0.9), rgba(15,23,42,0.9));
    backdrop-filter: blur(10px);
  }
  .card-front .word {
    font-size: 2rem;
    font-weight: 700;
    color: #f1f5f9;
    text-align: center;
    margin-bottom: 16px;
  }
  .card-front .example {
    font-size: 0.85rem;
    color: #64748b;
    font-style: italic;
    text-align: center;
    max-width: 90%;
  }
  .card-front .hint { color: #475569; font-size: 0.75rem; margin-top: 20px; }
  .card-back {
    background: linear-gradient(145deg, rgba(30,41,59,0.95), rgba(15,23,42,0.95));
    transform: rotateY(180deg);
    backdrop-filter: blur(10px);
  }
  .card-back .word { font-size: 1.5rem; font-weight: 700; color: #38bdf8; margin-bottom: 8px; }
  .card-back .meaning {
    font-size: 2rem;
    font-weight: 700;
    color: #fbbf24;
    margin-bottom: 12px;
    text-align: center;
  }
  .card-back .example {
    font-size: 0.85rem;
    color: #94a3b8;
    font-style: italic;
    text-align: center;
    max-width: 90%;
    margin-bottom: 8px;
  }


  /* Action buttons */
  .actions {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .actions button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .actions button:active { transform: scale(0.96); }
  .btn-known { background: #4ade80; color: #052e16; }
  .btn-known:hover { background: #22c55e; }
  .btn-unknown { background: #fb7185; color: #450a0a; }
  .btn-unknown:hover { background: #f43f5e; }
  .btn-skip { background: rgba(255,255,255,0.06); color: #94a3b8; flex: 0.5; }
  .btn-skip:hover { background: rgba(255,255,255,0.1); }

  /* Progress text */
  .progress-text { text-align: center; color: #64748b; font-size: 0.8rem; margin-bottom: 8px; }

  /* Session summary overlay */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .overlay.show { display: flex; }
  .overlay-box {
    background: #1e293b;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 36px;
    max-width: 380px;
    width: 90%;
    text-align: center;
  }
  .overlay-box h2 { font-size: 1.5rem; margin-bottom: 16px; }
  .overlay-box .big-num { font-size: 3rem; font-weight: 800; }
  .overlay-box .big-num.green { color: #4ade80; }
  .overlay-box .big-num.red { color: #fb7185; }
  .overlay-box .row { display: flex; justify-content: space-around; margin: 16px 0; }
  .overlay-box .row .item { text-align: center; }
  .overlay-box .row .item .val { font-size: 1.5rem; font-weight: 700; }
  .overlay-box button {
    margin-top: 12px;
    padding: 12px 36px;
    border: none;
    border-radius: 10px;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  .overlay-box button:hover { background: #7dd3fc; }

  /* Empty state */
  .empty-state { text-align: center; padding: 60px 20px; color: #64748b; }
  .empty-state .icon { font-size: 4rem; margin-bottom: 16px; }
  .empty-state p { font-size: 1rem; }

  /* Responsive */
  @media (max-width: 480px) {
    .card-front .word { font-size: 1.5rem; }
    .card-back .meaning { font-size: 1.5rem; }
    .card-face { min-height: 230px; padding: 24px 16px; }
    .stats-bar { flex-wrap: wrap; gap: 6px; }
    .controls button { font-size: 0.7rem; padding: 8px 4px; min-width: 55px; }
  }

  /* Flash animations */
  @keyframes flashGreen { 0%{background:rgba(74,222,128,0.3)} 100%{background:transparent} }
  @keyframes flashRed { 0%{background:rgba(251,113,133,0.3)} 100%{background:transparent} }
  .flash-known { animation: flashGreen 0.4s ease; }
  .flash-unknown { animation: flashRed 0.4s ease; }

  /* Utility */
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container" id="app">
  <div class="header">
    <h1>📚 ITDD & IT Integration Flashcards</h1>
    <p>Tap card to flip · IT Due Diligence · M&A Integration · CET-6+</p>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat"><span class="num" id="statTotal">0</span><span class="label">Total</span></div>
    <div class="stat"><span class="num green" id="statKnown">0</span><span class="label">Known ✅</span></div>
    <div class="stat"><span class="num red" id="statUnknown">0</span><span class="label">Unknown ❌</span></div>
    <div class="stat"><span class="num yellow" id="statPct">0%</span><span class="label">Mastered</span></div>
  </div>
  <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>

  <!-- Mode controls -->
  <div class="controls">
    <button class="active" data-mode="all" onclick="setMode('all')">🔄 All Words</button>
    <button data-mode="unknown" onclick="setMode('unknown')">❌ Unknown</button>
    <button data-mode="known" onclick="setMode('known')">✅ Known</button>
    <button onclick="resetProgress()">🔄 Reset</button>
  </div>

  <!-- Category filter -->


  <!-- Card area -->
  <div id="cardArea">
    <div class="progress-text" id="progressText">Card 0 of 0</div>
    <div class="card-container" id="cardContainer">
      <div class="card" id="card" onclick="flipCard()">
        <div class="card-face card-front">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
            <div class="word" id="frontWord" style="margin-bottom:0;">Ready?</div>
            <button class="speak-btn" onclick="event.stopPropagation();speakWord()" title="British pronunciation">🔊</button>
          </div>
          <div class="example" id="frontExample"></div>
          <div class="hint">👆 Tap to reveal answer</div>
        </div>
        <div class="card-face card-back">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
            <div class="word" id="backWord" style="margin-bottom:0;">word</div>
            <button class="speak-btn" onclick="event.stopPropagation();speakWord()" title="British pronunciation">🔊</button>
          </div>
          <div class="meaning" id="backMeaning">meaning</div>
          <div class="example" id="backExample"></div>

        </div>
      </div>
    </div>

    <div class="actions" id="actionButtons">
      <button class="btn-known" onclick="markKnown()">✅ Known</button>
      <button class="btn-unknown" onclick="markUnknown()">❌ Unknown</button>
      <button class="btn-skip" onclick="skipCard()">⏭ Skip</button>
    </div>
  </div>

  <!-- Empty state -->
  <div class="empty-state hidden" id="emptyState">
    <div class="icon">🎉</div>
    <p id="emptyMsg">All words mastered!</p>
  </div>

  <!-- Session overlay -->
  <div class="overlay" id="overlay">
    <div class="overlay-box">
      <h2>📊 Session Done</h2>
      <div class="row">
        <div class="item"><div class="val green" id="sessKnown">0</div><div style="color:#4ade80;font-size:0.8rem;">Known ✅</div></div>
        <div class="item"><div class="val red" id="sessUnknown">0</div><div style="color:#fb7185;font-size:0.8rem;">Unknown ❌</div></div>
      </div>
      <div style="margin:8px 0;color:#64748b;" id="sessTotal">0 cards reviewed</div>
      <button onclick="closeOverlay()">Continue</button>
    </div>
  </div>
</div>

// APP STATE

let state = {
  known: new Set(),    // indices of known words
  unknown: new Set(),  // indices of unknown words
  mode: "all",         // "all" | "known" | "unknown"

  currentIdx: 0,
  cards: [],           // filtered word list for current session
  sessionKnown: 0,
  sessionUnknown: 0,
  sessionMode: "all",
  isFlipped: false,
  sessionId: 0,
  savedCard: {},   // {all: globalIdx, unknown: globalIdx, known: globalIdx} — unflipped card preserved across mode switches
};

// Load from localStorage
function loadState() {
  try {
    const raw = localStorage.getItem("flashcard_state");
    if (raw) {
      const data = JSON.parse(raw);
      state.known = new Set(data.known || []);
      state.unknown = new Set(data.unknown || []);
    }
  } catch (e) { /* ignore */ }
}

function saveState() {
  try {
    localStorage.setItem("flashcard_state", JSON.stringify({
      known: [...state.known],
      unknown: [...state.unknown],
    }));
  } catch (e) { /* ignore */ }
}

// Shuffle array (Fisher-Yates)
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Start a session
function startSession(mode) {
  state.mode = mode || state.mode;
  state.sessionMode = state.mode;
  state.sessionKnown = 0;
  state.sessionUnknown = 0;
  state.isFlipped = false;
  state.sessionId++; // invalidate any pending delayed marks

  // Filter words by mode and build card list
  const allCards = WORDS;
  let filtered = allCards.filter((_, i) => {
    return (state.mode === "all" ||
            (state.mode === "known" && state.known.has(i)) ||
            (state.mode === "unknown" && state.unknown.has(i)));
  });

  // Store as objects with global index
  state.cards = filtered.map((_, i) => {
    const globalIdx = WORDS.indexOf(filtered[i]);
    return { word: filtered[i], globalIdx };
  });

  if (state.cards.length === 0) {
    showEmptyState();
    return;
  }

  shuffle(state.cards);

  // If we have a saved card for this mode, bring it to front
  const savedIdx = state.savedCard[state.mode];
  if (savedIdx !== undefined) {
    const pos = state.cards.findIndex(c => c.globalIdx === savedIdx);
    if (pos > 0) {
      const [item] = state.cards.splice(pos, 1);
      state.cards.unshift(item);
    }
  }

  state.currentIdx = 0;
  showCard();
  updateUI();
  document.getElementById("emptyState").classList.add("hidden");
  document.getElementById("cardArea").classList.remove("hidden");
}

function showEmptyState() {
  document.getElementById("cardArea").classList.add("hidden");
  const empty = document.getElementById("emptyState");
  empty.classList.remove("hidden");
  const msg = document.getElementById("emptyMsg");
  if (state.mode === "unknown") {
    msg.textContent = "🎉 No unknown words! You're acing it!";
  } else if (state.mode === "known") {
    msg.textContent = "📭 No known words yet. Start reviewing!";
  } else {
    msg.textContent = "📭 No words match this filter.";
  }
}

function showCard() {
  if (state.currentIdx >= state.cards.length) {
    showSessionSummary();
    return;
  }

  state.isFlipped = false;
  const card = state.cards[state.currentIdx];
  const w = card.word;

  document.getElementById("frontWord").textContent = w.en;
  document.getElementById("frontExample").textContent = w.ex ? `"${w.ex}"` : "";
  document.getElementById("backWord").textContent = w.en;
  document.getElementById("backMeaning").textContent = w.zh;
  document.getElementById("backExample").textContent = w.ex ? `"${w.ex}"` : "";


  document.getElementById("card").classList.remove("flipped");
  document.getElementById("cardContainer").classList.remove("flash-known", "flash-unknown");

  const total = state.cards.length;
  document.getElementById("progressText").textContent = `Card ${state.currentIdx + 1} of ${total}`;
  updateUI();
}

function flipCard() {
  if (state.isFlipped) {
    // Flip back to front
    state.isFlipped = false;
    document.getElementById("card").classList.remove("flipped");
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  } else {
    // Flip to answer side — auto-pronounce!
    state.isFlipped = true;
    document.getElementById("card").classList.add("flipped");
    delete state.savedCard[state.mode];
    setTimeout(() => speakWord(), 400);
  }
}

function markKnown() {
  delete state.savedCard[state.mode];
  doMark("known");
}

function markUnknown() {
  // Directly mark as unknown — no flip, no pronunciation, just move on
  delete state.savedCard[state.mode];
  doMark("unknown");
}

function doMark(result) {
  const mySessionId = state.sessionId;
  const card = state.cards[state.currentIdx];
  if (!card) return;
  const globalIdx = card.globalIdx;

  if (result === "known") {
    state.known.add(globalIdx);
    state.unknown.delete(globalIdx);
    state.sessionKnown++;
    document.getElementById("cardContainer").classList.add("flash-known");
  } else {
    state.unknown.add(globalIdx);
    state.known.delete(globalIdx);
    state.sessionUnknown++;
    document.getElementById("cardContainer").classList.add("flash-unknown");
  }

  saveState();
  state.currentIdx++;

  setTimeout(() => {
    // Only advance if still in the same session
    if (state.sessionId !== mySessionId) return;
    if (state.currentIdx < state.cards.length) {
      showCard();
    } else {
      showSessionSummary();
    }
  }, 250);
}

function skipCard() {
  state.currentIdx++;
  if (state.currentIdx < state.cards.length) {
    showCard();
  } else {
    showSessionSummary();
  }
}

function speakWord() {
  if (!window.speechSynthesis) return;
  // Cancel any ongoing speech
  window.speechSynthesis.cancel();
  const card = state.cards[state.currentIdx];
  if (!card) return;
  const w = card.word;
  const utterance = new SpeechSynthesisUtterance(w.en);
  utterance.lang = "en-GB";
  utterance.rate = 0.85;
  utterance.pitch = 0.95;
  // Try to find a British voice
  const voices = window.speechSynthesis.getVoices();
  const britishVoice = voices.find(v => v.lang.startsWith("en-GB"));
  if (britishVoice) utterance.voice = britishVoice;
  window.speechSynthesis.speak(utterance);
}

function showSessionSummary() {
  const known = state.sessionKnown;
  const unknown = state.sessionUnknown;
  const total = known + unknown;

  document.getElementById("sessKnown").textContent = known;
  document.getElementById("sessUnknown").textContent = unknown;
  document.getElementById("sessTotal").textContent = `${total} cards reviewed`;

  document.getElementById("overlay").classList.add("show");

  // Update stats
  updateUI();
}

function closeOverlay() {
  document.getElementById("overlay").classList.remove("show");
  startSession(state.mode);
}

function updateUI() {
  const total = WORDS.length;
  const known = state.known.size;
  const unknown = state.unknown.size;
  const pct = total ? Math.round(known / total * 100) : 0;

  document.getElementById("statTotal").textContent = total;
  document.getElementById("statKnown").textContent = known;
  document.getElementById("statUnknown").textContent = unknown;
  document.getElementById("statPct").textContent = pct + "%";
  document.getElementById("progressFill").style.width = pct + "%";
}

function setMode(mode) {
  // Save current unflipped card before switching away
  if (state.cards.length > 0 && state.currentIdx < state.cards.length) {
    if (!state.isFlipped) {
      state.savedCard[state.mode] = state.cards[state.currentIdx].globalIdx;
    } else {
      // Card was flipped/interacted — clear saved for this mode
      delete state.savedCard[state.mode];
    }
  }
  state.isFlipped = false;
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  state.mode = mode;
  document.querySelectorAll(".controls button[data-mode]").forEach(b => {
    b.classList.toggle("active", b.dataset.mode === mode);
  });
  startSession(mode);
}

function resetProgress() {
  if (!confirm("Reset all progress? This cannot be undone.")) return;
  state.known.clear();
  state.unknown.clear();
  saveState();
  startSession(state.mode);
}

// Keyboard shortcuts
document.addEventListener("keydown", (e) => {
  if (document.getElementById("overlay").classList.contains("show")) {
    if (e.key === "Enter" || e.key === " ") { closeOverlay(); e.preventDefault(); }
    return;
  }
  if (e.key === " " || e.key === "Enter") { flipCard(); e.preventDefault(); }
  if (e.key === "k" || e.key === "K") { markKnown(); }
  if (e.key === "u" || e.key === "U") { markUnknown(); }
  if (e.key === "s" || e.key === "S") { skipCard(); }
  if (e.key === "1") { setMode("all"); }
  if (e.key === "2") { setMode("unknown"); }
  if (e.key === "3") { setMode("known"); }
});

// Init
loadState();

startSession("all");
</script>
</body>
</html>
